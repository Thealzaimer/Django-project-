<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff" rx="10"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Segoe UI, Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">AutoFlow: Zero-Trust MCP Orchestration</text>

  <!-- LLM Brain -->
  <rect x="300" y="70" width="200" height="60" rx="30" fill="#3498db" />
  <text x="400" y="105" font-family="Segoe UI, Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="white">LLM BRAIN</text>

  <!-- Funnel Shape using stacked blocks -->
  <!-- Layer 0: Discovery -->
  <rect x="200" y="150" width="400" height="50" rx="5" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  <text x="400" y="180" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#7f8c8d">LAYER 0: DISCOVERY ENGINE (Handshake)</text>

  <!-- Layer 1: Bouncer -->
  <rect x="225" y="210" width="350" height="50" rx="5" fill="#fadbd8" stroke="#e74c3c" stroke-width="2"/>
  <text x="400" y="240" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">LAYER 1: THE BOUNCER (IDOR Protection)</text>

  <!-- Layer 2: Contract -->
  <rect x="250" y="270" width="300" height="50" rx="5" fill="#d5f5e3" stroke="#2ecc71" stroke-width="2"/>
  <text x="400" y="300" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e8449">LAYER 2: THE CONTRACT (Pydantic Validation)</text>

  <!-- Layer 3: Router -->
  <rect x="275" y="330" width="250" height="50" rx="5" fill="#d1f2eb" stroke="#1abc9c" stroke-width="2"/>
  <text x="400" y="360" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#117864">LAYER 3: THE ROUTER (Tool Registry)</text>

  <!-- Layer 4: Engine -->
  <rect x="300" y="390" width="200" height="50" rx="5" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/>
  <text x="400" y="420" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b5345">LAYER 4: THE ENGINE (Atomic Logic)</text>

  <!-- Layer 5: State & Ledger -->
  <rect x="200" y="480" width="180" height="70" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
  <text x="290" y="515" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#512e5f">THE STATE</text>
  <text x="290" y="535" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" fill="#512e5f">(Workflows Table)</text>

  <rect x="420" y="480" width="180" height="70" rx="10" fill="#ebedef" stroke="#34495e" stroke-width="2"/>
  <text x="510" y="515" font-family="Segoe UI, Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">THE LEDGER</text>
  <text x="510" y="535" font-family="Segoe UI, Arial" font-size="12" text-anchor="middle" fill="#2c3e50">(Audit Log Table)</text>

  <!-- Arrows -->
  <path d="M 400 130 L 400 150" stroke="#3498db" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 200 L 400 210" stroke="#bdc3c7" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 260 L 400 270" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 320 L 400 330" stroke="#2ecc71" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 380 L 400 390" stroke="#1abc9c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Split arrow at end -->
  <path d="M 400 440 L 400 460 L 290 460 L 290 480" stroke="#16a085" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 460 L 510 460 L 510 480" stroke="#16a085" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
    </marker>
  </defs>
</svg>